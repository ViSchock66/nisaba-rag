[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nisaba-rag"
version = "0.1.0"
description = "Self-hosted retrieval-augmented generation over your own documents, exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "retrieval", "mcp", "embeddings", "bm25", "chromadb", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]

# Core: indexing, dense and hybrid search, and the cross-encoder reranker.
#
# The reranker stack is a core dependency, not an extra: Nisaba's headline
# feature is hybrid retrieval with reranking, and shipping it as opt-in would
# mean the default install silently lacks it. All three packages are
# cross-platform; the GPU execution providers are the optional part, and they
# are selected at runtime via reranker.provider.
dependencies = [
  "chromadb>=0.5.0",
  # The MCP Python SDK renamed FastMCP to MCPServer in v2, and removed the old
  # mcp.server.fastmcp module. server.py imports the v2 path, so v1 must be
  # excluded: allowing it would resolve to a version whose import fails.
  "mcp>=2.0.0",
  "httpx>=0.27.0",
  "onnxruntime>=1.17.0",
  "tokenizers>=0.15.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
# GPU execution providers for the reranker. Install only the one matching your
# hardware; the engine falls back to CPU when the requested provider is absent.
#   NVIDIA:  pip install -e ".[gpu-cuda]"
#   Windows: pip install -e ".[gpu-dml]"
gpu-cuda = ["onnxruntime-gpu>=1.17.0"]
gpu-dml = ["onnxruntime-directml>=1.17.0"]
# Development: tests and linting.
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
nisaba-rag = "nisaba_rag.cli:main"

[project.urls]
Homepage = "https://github.com/ViSchock66/nisaba-rag"
Issues = "https://github.com/ViSchock66/nisaba-rag/issues"

[tool.setuptools]
packages = ["nisaba_rag"]

[tool.setuptools.package-data]
nisaba_rag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a live external service (a running embedding server)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
